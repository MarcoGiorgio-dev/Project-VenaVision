{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<form method="post" class="mt-4" style="max-width: 400px;">
  <h2 class="mb-3">Log ind</h2>
  <input class="form-control mb-2" name="username" placeholder="Brugernavn" required>
  <input class="form-control mb-2" type="password" name="password" placeholder="Adgangskode" required>
  <button class="btn btn-primary w-100" type="submit">Log ind</button>
</form>
{% endblock %}
