{% extends "base.html" %}
{% block title %}Patienter{% endblock %}

{% block content %}

<h1 class="mt-4">Patienter</h1>

<form method="post" class="row g-3 mb-4" style="max-width: 600px;">

    <div class="col-12">
        <input
            class="form-control"
            type="text"
            name="first_name"
            placeholder="First name"
            required>
    </div>

    <div class="col-12">
        <input
            class="form-control"
            type="text"
            name="last_name"
            placeholder="Last name"
            required>
    </div>

    <div class="col-12">
        <label for="birth_date" class="form-label">Birth date</label>
        <input
            class="form-control"
            type="date"
            name="birth_date"
            id="birth_date"
            required>
    </div>
    
    <div class="col-12">
        <label for="last_prick" class="form-label">Last prick</label>
        <input
            class="form-control"
            type="date"
            name="last_prick"
            id="last_prick"
            required>
    </div>

    <div class="col-12">
        <label for="follow_up" class="form-label">Follow-up</label>
        <input
            class="form-control"
            type="date"
            name="follow_up"
            id="follow_up"
            required>
    </div>

    <div class="col-12">
        <select class="form-select" name="sex" required>
            <option value="" disabled selected>Choose gender</option>
            <option value="Mand">Male</option>
            <option value="Kvinde">Female</option>
        </select>
    </div>

    <div class="col-12">
        <input
            class="form-control"
            type="text"
            name="cpr"
            placeholder="CPR"
            maxlength="11"
            required>
    </div>

    <div class="col-12">
        <select class="form-select" name="blood_type" required>
            <option value="" disabled selected>Choose blood type</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>
    </div>

    <div class="col-12">
        <button class="btn btn-primary" type="submit">
            submit
        </button>
    </div>

</form>

<h2 class="h4">Patient overview</h2>

<div class="list-group" style="max-width: 600px;">

    {% for p in patients %}

        <a class="list-group-item list-group-item-action"
           href="{{ url_for('patient', patient_id=p[0]) }}">

            {{ p[1] }} {{ p[2] }}

        </a>

    {% else %}

        <p>No patients yet.</p>

    {% endfor %}

</div>

{% endblock %}
